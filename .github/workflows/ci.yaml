name: CI & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter & Format Check
        run: |
          npm run lint
          npm run format:check

      - name: Run Tests & Verify >95% Code Coverage Threshold
        run: npm run test:coverage

      - name: Type Check & Build
        run: npm run build
